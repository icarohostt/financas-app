<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1118" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Finanças da Casa</title>
<style>
:root{
  --bg:#F4F5F7; --card:#FFFFFF; --tx:#0F1A2A; --tx2:#5A6472; --tx3:#3F4955; --linha:#EDEFF2; --borda:#E6E8EC; --tile:#EEF1F4;
  --pri:#0B7A5C; --pri-tx:#FFFFFF; --pri-esc:#075C45; --pri2:#E3F2EC;
  --hero:#0F1A2A; --hero-tx2:#B9C3CF; --hero-ac:#5EE0B0;
  --ok:#0B7A5C; --alerta:#D98A1C; --alerta-tx:#7A4200; --alertabg:#FFF4E2; --neg:#C2410C; --neg-tx:#8F2A12; --negbg:#FDECE7;
  --sombra:0 1px 2px rgba(15,26,42,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0B1118; --card:#151E28; --tx:#E8EDF2; --tx2:#9AA6B4; --tx3:#C3CCD6; --linha:#222D39; --borda:#2A3644; --tile:#1F2A36;
    --pri:#3DD6A3; --pri-tx:#06251B; --pri-esc:#5EE0B0; --pri2:#123A30; --hero:#1B2734;
    --alerta-tx:#F5C27A; --alertabg:#3A2A10; --neg:#F07A52; --neg-tx:#F4A58C; --negbg:#3A1A12; --sombra:none}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
svg{flex:none}
#topo{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 16px 8px;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.topo1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.topo1 h1{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:0}
.ola{display:flex;flex-direction:column;gap:1px}
.ola span{font-size:13px;color:var(--tx2)} .ola b{font-size:21px;font-weight:800;letter-spacing:-.4px}
.topo-dir{display:flex;align-items:center;gap:8px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);background:var(--card);border:0;padding:7px 11px;border-radius:999px;cursor:pointer}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.dot.sync,.dot.pend{background:var(--alerta)} .dot.erro,.dot.offline{background:var(--neg)} .dot.vazio{background:var(--tx2)}
.demo-tag{font-size:11px;font-weight:700;color:var(--alerta-tx);background:var(--alertabg);padding:4px 8px;border-radius:999px}
.icon-btn{width:44px;height:44px;border-radius:14px;border:0;background:var(--card);color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ciclo{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:4px}
.ciclo button{border:0;background:none;width:44px;height:44px;border-radius:12px;cursor:pointer;color:var(--pri);display:flex;align-items:center;justify-content:center}
.ciclo .nome{text-align:center;line-height:1.2;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.ciclo .nome b{font-size:15px;font-weight:700} .ciclo .nome small{color:var(--tx2);font-size:12px}
main{max-width:720px;margin:0 auto;padding:4px 16px 16px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sombra);padding:18px;margin:0 0 14px}
.card h3{margin:0 0 10px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3 small{font-weight:400;color:var(--tx2);font-size:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.sec-h h2{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.sec-h small{font-size:12px;color:var(--tx2);text-align:right}
.sec-h.solta{padding:2px 4px 0;margin-bottom:10px}
.sub,.mini{color:var(--tx2);font-size:12.5px}
.neg{color:var(--neg)!important}
/* destaque */
.hero{background:var(--hero);color:#fff;border-radius:24px;padding:22px 20px 20px;margin:0 0 14px;display:flex;flex-direction:column;gap:12px}
.hero-rot{font-size:13px;color:var(--hero-tx2)}
.hero-val{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.05}
.hero-val.neg{color:#FFB59E!important}
.hero-dia{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:#DDE3EA}
.hero-chip{background:rgba(94,224,176,.16);color:var(--hero-ac);font-weight:700;padding:4px 10px;border-radius:999px}
.hero-furo{font-size:12.5px;line-height:1.4;color:#FFD0C2;background:rgba(240,122,82,.16);padding:8px 10px;border-radius:12px}
.hero-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.hero-bar i{display:block;height:100%;background:var(--hero-ac);border-radius:99px}
.hero-bar i.neg{background:#F07A52}
.hero-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hero-stats span{display:block;font-size:12px;color:var(--hero-tx2)} .hero-stats b{font-size:16px;font-weight:700}
/* consultor */
.rec{display:flex;gap:12px;padding:14px;border-radius:16px;margin-top:10px;background:var(--bg)}
.rec-ic{width:32px;height:32px;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;flex:none}
.rec-c{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.rec-c b{font-size:14px;font-weight:700} .rec-c p{margin:0;font-size:13px;line-height:1.4;color:var(--tx3)}
.rec-a{align-self:flex-start;border:0;background:none;padding:2px 0 0;font-size:13px;font-weight:700;cursor:pointer;color:inherit}
.rec.alto{background:var(--negbg)} .rec.alto .rec-ic,.rec.alto b,.rec.alto .rec-a{color:var(--neg-tx)} .rec.alto p{color:var(--neg-tx);opacity:.92}
.rec.medio{background:var(--alertabg)} .rec.medio .rec-ic,.rec.medio b,.rec.medio .rec-a{color:var(--alerta-tx)} .rec.medio p{color:var(--alerta-tx);opacity:.92}
.rec.ok{background:var(--pri2)} .rec.ok .rec-ic,.rec.ok b{color:var(--pri-esc)}
.rec .rec-a{color:var(--pri)}
/* categorias */
.cat-row{all:unset;box-sizing:border-box;width:100%;display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--linha);cursor:pointer}
.cat-row:first-of-type{border-top:0}
.tile{width:40px;height:40px;border-radius:12px;background:var(--tile);color:var(--tx);display:flex;align-items:center;justify-content:center;flex:none;font-size:18px}
.tile.alerta{background:var(--alertabg);color:var(--alerta-tx)} .tile.neg{background:var(--negbg);color:var(--neg-tx)}
.cat-c{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.cat-t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cat-t span:first-child{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-t span:last-child{font-size:13px;font-weight:600;color:var(--tx3);white-space:nowrap}
.cat-t span.alerta{color:var(--alerta-tx)} .cat-t span.neg{color:var(--neg)}
.pbar{height:6px;border-radius:99px;background:var(--linha);overflow:hidden;display:block}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.pbar i.alerta{background:var(--alerta)} .pbar i.estouro{background:var(--neg)}
.barra{height:6px;border-radius:99px;background:var(--linha);overflow:hidden;margin:8px 0 4px}
.barra i{display:block;height:100%;background:var(--ok);border-radius:99px}
.barra i.alerta{background:var(--alerta)} .barra i.estouro{background:var(--neg)}
/* contas */
.conta{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--linha)}
.conta:first-of-type{border-top:0}
.conta-c{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.conta-c b{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .conta-c small{font-size:12px;color:var(--tx2)}
.conta-v{font-size:14.5px;font-weight:700;white-space:nowrap}
.conta.pago b,.conta.pago .conta-v{color:var(--tx2);text-decoration:line-through;font-weight:500}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid #C9CED6;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:#fff;padding:0}
.chk.on{background:var(--ok);border-color:var(--ok);color:var(--pri-tx)}
.link-row{all:unset;box-sizing:border-box;width:100%;display:block;padding:12px 0 2px;border-top:1px solid var(--linha);font-size:13.5px;font-weight:700;color:var(--pri);cursor:pointer}
/* cartões */
.ccards{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.cc{flex:none;width:240px;min-height:136px;border-radius:18px;background:var(--card);padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;scroll-snap-align:start;box-shadow:var(--sombra)}
.cc.esc{background:var(--hero);color:#fff}
.cc-n{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--tx3)}
.cc.esc .cc-n{color:#DDE3EA}
.cc b{font-size:24px;font-weight:800} .cc small{font-size:12px;color:var(--tx2)} .cc.esc small{color:var(--hero-tx2)}
.cc-total{display:flex;justify-content:space-between;padding:10px 4px 0;font-size:13px;color:var(--tx3);margin-bottom:14px}
.cc-total b{color:var(--tx)}
.linha-card{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:16px 18px;margin:0 0 14px;cursor:pointer;box-shadow:var(--sombra)}
.linha-card .lc{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.linha-card b{font-size:14.5px;font-weight:700} .linha-card small{font-size:12px;color:var(--tx2)}
.aviso{background:var(--alertabg);color:var(--alerta-tx);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;cursor:pointer;font-weight:600}
.aviso.neg{background:var(--negbg);color:var(--neg-tx)}
.aviso.ok{background:var(--pri2);color:var(--pri-esc)}
.voltar{border:0;background:none;color:var(--pri);font-weight:700;font-size:14.5px;padding:4px 2px 12px;cursor:pointer;display:flex;align-items:center;gap:4px}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 16px;background:var(--pri);color:var(--pri-tx);font-weight:700;cursor:pointer;width:100%;margin-top:12px}
.btn.sec{background:var(--pri2);color:var(--pri-esc)}
.btn.neutro{background:var(--bg);color:var(--tx)}
.btn.perigo{background:var(--negbg);color:var(--neg-tx)}
.btn.peq{width:auto;padding:8px 12px;margin-top:0;font-size:13px}
.btn.grande{padding:16px;font-size:16px;font-weight:800;border-radius:16px}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.duo .btn{margin-top:12px}
/* listas genéricas */
.linhas .ln{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--linha)}
.linhas .ln:first-child{border-top:0}
.ln .meio{flex:1;min-width:0}
.ln .meio b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .meio small{color:var(--tx2);font-size:12px}
.ln .val{font-weight:700;white-space:nowrap}
.ln .ic{width:40px;height:40px;border-radius:12px;background:var(--tile);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.ln.click{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--borda);background:var(--card);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;line-height:1.2;text-align:left;color:var(--tx)}
.chip small{display:block;font-size:11px;color:var(--tx2)}
.chip.on{border-color:var(--pri);background:var(--pri2);color:var(--pri-esc);font-weight:700}
.chip.on small{color:var(--pri-esc)}
.chip.escuro.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.rolar{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;margin:0 -16px 10px;padding-left:16px;padding-right:16px;-webkit-overflow-scrolling:touch}
.rolar .chip{white-space:nowrap;flex:none}
.campo{margin:14px 0 0}
.campo>label{display:block;font-size:12px;color:var(--tx2);margin-bottom:7px;font-weight:600}
input:not([type]),input[type=text],input[type=date],input[type=number],input[type=password],input[type=search],input.money,select{width:100%;padding:11px 12px;border:1.5px solid var(--borda);border-radius:12px;background:var(--card);color:var(--tx)}
input:focus,select:focus{outline:none;border-color:var(--pri)}
input:disabled{opacity:.6}
input.grande-in{font-size:28px;font-weight:700;padding:10px 12px}
.pl{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--linha)}
.pl:first-child{border-top:0}
.pl .nm{flex:1;min-width:0;font-size:14.5px;font-weight:600}
.pl .nm small{display:block;color:var(--tx2);font-size:12px;font-weight:400}
.pl input.money{width:122px;text-align:right;padding:9px 10px}
.x{border:0;background:none;color:var(--tx2);font-size:18px;cursor:pointer;padding:4px 6px}
.eq{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13.5px}
.eq .t{font-weight:700;border-top:1px solid var(--linha);padding-top:8px;margin-top:2px}
/* planejar */
.aloc-bar{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;margin:12px 0}
.aloc-bar span{display:block;height:100%}
.leg{display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.leg div{display:flex;justify-content:space-between;gap:8px} .leg div span:first-child{display:flex;align-items:center;gap:8px}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.aloc-st{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--linha);padding-top:12px;margin-top:12px;font-weight:700}
.aloc-st b{font-size:16px;font-weight:800}
.rec-card{border:2px solid var(--pri)}
.rec-it{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--linha);font-size:13.5px}
.rec-it:first-child{border-top:0} .rec-it b{color:var(--pri-esc);white-space:nowrap}
.opc{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13.5px;cursor:pointer;margin-top:12px}
.opc input{width:22px;height:22px;accent-color:var(--pri)}
details.acc{padding:0 18px}
details.acc>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 0;cursor:pointer}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .acc-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
details.acc>summary .acc-t b{font-size:15px;font-weight:700} details.acc>summary .acc-t small{font-size:12px;color:var(--tx2);font-weight:400}
details.acc>summary .acc-v{font-weight:700;white-space:nowrap}
details.acc>summary .chev{transition:transform .15s;color:var(--tx2)}
details.acc[open]>summary .chev{transform:rotate(90deg)}
details.acc .acc-corpo{padding:0 0 14px}
.stepper{display:flex;align-items:center;background:var(--bg);border-radius:12px;flex:none}
.stepper button{width:36px;height:42px;border:0;background:transparent;font-size:20px;cursor:pointer;color:var(--tx)}
.stepper input.money{width:84px!important;border:0!important;background:transparent!important;text-align:center!important;font-weight:700;padding:8px 0!important}
/* metas */
.meta-top{display:flex;gap:14px;align-items:center}
.meta-top .mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.meta-top .mt b{font-size:15px;font-weight:700} .meta-top .mt strong{font-size:20px;font-weight:800} .meta-top .mt small{font-size:12px;color:var(--tx2)}
.proj{display:flex;justify-content:space-between;gap:10px;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:14px}
.proj span{color:var(--tx3)} .proj b{text-align:right}
.fech{background:var(--hero);color:#fff}
.fech .sub{color:var(--hero-tx2)} .fech .eq{color:#DDE3EA} .fech .eq .t{color:#fff;border-color:rgba(255,255,255,.16)}
.fech .btn{background:var(--hero-ac);color:#0F1A2A}
/* extrato */
.busca{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:0 14px;color:var(--tx2);margin-bottom:12px}
.busca input{border:0!important;background:transparent!important;padding:13px 0!important;flex:1}
.ext-resumo{display:flex;justify-content:space-between;font-size:13px;color:var(--tx3);padding:0 4px 10px}
.ext-resumo b{color:var(--tx)}
.dia-h{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tx2);padding-bottom:4px}
.dia-h b{color:var(--tx)}
.lanc{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--linha);cursor:pointer}
.dia-h+.lanc{border-top:0}
.lanc .lc{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lanc .lc b{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .lanc .lc small{font-size:12px;color:var(--tx2)}
.lanc .lv{font-size:14.5px;font-weight:700;white-space:nowrap}
/* navegação inferior */
#abas{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--borda);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
#abas[hidden]{display:none}
#abas button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--tx2);padding:4px 0;cursor:pointer}
#abas button.on{color:var(--pri);font-weight:700}
#abas .fab{justify-self:center;width:56px;height:56px;margin-top:-28px;border-radius:18px;background:var(--pri);color:var(--pri-tx);box-shadow:0 8px 20px rgba(11,122,92,.35)}
/* folhas */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(15,26,42,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom))}
.sheet-alca{display:block;width:40px;height:5px;border-radius:99px;background:var(--borda);margin:0 auto 8px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sheet-h h2{font-size:18px;font-weight:800;margin:0}
.sheet-h .icon-btn{background:var(--bg)}
.valor-box{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:6px}
.valor-box>span{font-size:12px;font-weight:600;color:var(--tx2)}
.valor-w{display:flex;align-items:baseline;justify-content:center;gap:6px;width:100%}
.valor-w em{font-style:normal;font-size:22px;font-weight:700;color:var(--tx2)}
.valor-in{border:0!important;background:transparent!important;text-align:left;font-size:40px!important;font-weight:800;letter-spacing:-1px;padding:2px 0!important;width:4.5ch;min-width:3ch;max-width:260px;outline:none}

<body>
<header id="topo"></header>
<main id="main"></main>
<nav id="abas" aria-label="Navegação principal" hidden></nav>
<div id="sheet" class="sheet-wrap" hidden></div>
<div id="toast" hidden></div>
<script>
'use strict';
/* =====================================================================
   Finanças da Casa — orçamento base zero por categoria, ciclo da fatura.
   Dados: um arquivo JSON (financas.json) num repositório privado do
   GitHub, lido e gravado pela API com um token de acesso.
   Valores monetários em CENTAVOS (inteiros).
   ===================================================================== */

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const soma = arr => arr.reduce((a, b) => a + (b || 0), 0);
const somaObj = o => soma(Object.values(o || {}));
const fmt = c => ((c || 0) / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const inputValor = c => ((c || 0) / 100).toFixed(2).replace('.', ',');
function parseValor(s) {
  s = String(s == null ? '' : s).replace(/[R$\s]/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return isFinite(n) ? Math.round(n * 100) : NaN;
}
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES3 = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const pad = n => String(n).padStart(2, '0');
function hojeISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function ymAdd(ym, n) { let [y, m] = ym.split('-').map(Number); m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return `${y}-${pad(m)}`; }
function ymDiff(a, b) { const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number); return (ya - yb) * 12 + (ma - mb); }
function diasNoMes(ym) { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function diaNoMes(ym, dia) { return `${ym}-${pad(Math.min(dia, diasNoMes(ym)))}`; }
function diffDias(a, b) { const p = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)); return Math.round((p(b) - p(a)) / 864e5); }
const fmtD = iso => `${iso.slice(8, 10)}/${iso.slice(5, 7)}`;
function nomeCiclo(ym) { const [y, m] = ym.split('-').map(Number); return `${MESES[m - 1]}/${y}`; }
function curtoCiclo(ym) { const [y, m] = ym.split('-').map(Number); return `${MES3[m - 1]}/${String(y).slice(2)}`; }

/* ---------- ciclo da fatura ----------
   O ciclo "AAAA-MM" vai do dia seguinte ao fechamento do mês anterior até o
   dia do fechamento no mês MM. Ex.: fechamento 25 → Dezembro/2026 = 26/11 a 25/12. */
function fech() { return (cfg() && cfg().cartao && cfg().cartao.fechamento) || 25; }
function cicloDaData(iso, f) {
  f = f || fech(); const ym = iso.slice(0, 7), d = +iso.slice(8, 10);
  return d <= Math.min(f, diasNoMes(ym)) ? ym : ymAdd(ym, 1);
}
function cicloRange(ym, f) {
  f = f || fech(); const ant = ymAdd(ym, -1); const fimAnt = Math.min(f, diasNoMes(ant));
  const ini = fimAnt >= diasNoMes(ant) ? `${ym}-01` : `${ant}-${pad(fimAnt + 1)}`;
  return { ini, fim: diaNoMes(ym, f) };
}
/* Rendas e contas fixas seguem o mês do calendário que dá nome ao ciclo:
   em Dezembro/2026 entram o salário de 15/12 e 31/12 e as contas de 10, 15 e 30/12.
   Só os gastos variáveis (cartão) seguem a janela da fatura (24/11 a 23/12). */
function dataNoCiclo(ym, dia) { return diaNoMes(ym, dia); }
function vencimentoFatura(ym) {
  const c = cfg().cartao, v = c.vencimento || 1;
  return v > c.fechamento ? diaNoMes(ym, v) : diaNoMes(ymAdd(ym, 1), v);
}

/* ---------- modelo de dados ---------- */
function dadosVazios() {
  return {
    versao: 1,
    config: {
      pessoas: ['Pessoa 1', 'Pessoa 2'],
      cartao: { fechamento: 25, vencimento: 1 },
      formas: [{ id: 'cartao', nome: 'Cartão de crédito', cartao: true }, { id: 'pix', nome: 'Pix', cartao: false },
               { id: 'debito', nome: 'Débito', cartao: false }, { id: 'dinheiro', nome: 'Dinheiro', cartao: false }],
      rendas: [], fixas: [],
      categorias: [['mercado','🛒','Mercado'],['combustivel','⛽','Combustível'],['restaurante','🍔','Restaurante/delivery'],
                   ['farmacia','💊','Farmácia'],['lazer','🎉','Lazer'],['imprevistos','❓','Imprevistos']]
                  .map(([id, icone, nome]) => ({ id, icone, nome, limite: 0 })),
      fundos: [{ id: 'reserva', icone: '🛟', nome: 'Reserva de emergência', meta: 0, aporte: 0, saldoInicial: 0 }]
    },
    orcamentos: {}, lancamentos: [], movimentos: []
  };
}
function normalizar(d) {
  d.orcamentos = d.orcamentos || {}; d.lancamentos = d.lancamentos || []; d.movimentos = d.movimentos || [];
  const c = d.config = d.config || {};
  c.pessoas = c.pessoas || []; c.cartao = c.cartao || { fechamento: 25, vencimento: 1 };
  c.formas = c.formas || []; c.rendas = c.rendas || []; c.fixas = c.fixas || [];
  c.categorias = c.categorias || []; c.fundos = c.fundos || [];
  return d;
}
function setPath(obj, path, v) {
  let o = obj;
  for (let i = 0; i < path.length - 1; i++) { if (o[path[i]] == null || typeof o[path[i]] !== 'object') o[path[i]] = {}; o = o[path[i]]; }
  const k = path[path.length - 1];
  if (v === undefined || v === null) delete o[k]; else o[k] = v;
}
/* Operações: cada alteração é uma operação reaplicável. Se duas pessoas
   gravarem ao mesmo tempo, o app baixa a versão nova e reaplica as suas. */
function aplicarOp(d, op) {
  normalizar(d);
  const P = () => (d.orcamentos[op.ciclo] = d.orcamentos[op.ciclo] || {});
  switch (op.t) {
    case 'lanc.add': if (!d.lancamentos.some(x => x.id === op.l.id)) d.lancamentos.push(op.l); break;
    case 'lanc.upd': { const i = d.lancamentos.findIndex(x => x.id === op.l.id); if (i >= 0) d.lancamentos[i] = op.l; break; }
    case 'lanc.del': d.lancamentos = d.lancamentos.filter(x => x.id !== op.id); break;
    case 'plano.set': setPath(P(), op.path, op.v); break;
    case 'plano.push': { const p = P(); p[op.campo] = p[op.campo] || []; if (!p[op.campo].some(x => x.id === op.v.id)) p[op.campo].push(op.v); break; }
    case 'plano.pull': { const p = d.orcamentos[op.ciclo]; if (p && p[op.campo]) p[op.campo] = p[op.campo].filter(x => x.id !== op.id); break; }
    case 'plano.reset': { const p = d.orcamentos[op.ciclo]; if (p) ['rendas', 'fixas', 'limites', 'aportes'].forEach(k => delete p[k]); break; }
    case 'mov.add': if (!d.movimentos.some(x => x.id === op.m.id)) d.movimentos.push(op.m); break;
    case 'mov.del': d.movimentos = d.movimentos.filter(x => x.id !== op.id); break;
    case 'ciclo.fechar':
      if (d.orcamentos[op.ciclo] && d.orcamentos[op.ciclo].fechado) break; // outra pessoa já fechou
      d.orcamentos[op.ciclo] = op.snap; op.movs.forEach(m => d.movimentos.push(m)); break;
    case 'ciclo.reabrir': {
      const p = d.orcamentos[op.ciclo];
      if (p) { p.fechado = false; delete p.snapshot; delete p.fechamento; }
      d.movimentos = d.movimentos.filter(m => m.fechamento !== op.ciclo); break;
    }
    case 'config.set': setPath(d.config, op.path, op.v); break;
  }
  return d;
}

/* ---------- armazenamento ---------- */
function erro(msg, extra) { return Object.assign(new Error(msg), extra || {}); }
function b64enc(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64dec(b64) { const bin = atob(String(b64).replace(/\s/g, '')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }

class GitHubStore {
  constructor(c) {
    this.owner = c.owner; this.repo = c.repo; this.branch = c.branch || 'main'; this.path = c.path || 'financas.json';
    this.token = c.token; this.api = (c.api || 'https://api.github.com').replace(/\/$/, '');
    this.id = `${this.owner}/${this.repo}/${this.path}`;
  }
  url(q) { return `${this.api}/repos/${encodeURIComponent(this.owner)}/${encodeURIComponent(this.repo)}/contents/${this.path.split('/').map(encodeURIComponent).join('/')}${q ? '?ref=' + encodeURIComponent(this.branch) : ''}`; }
  hdr(x) { return Object.assign({ 'Accept': 'application/vnd.github+json', 'Authorization': `Bearer ${this.token}`, 'X-GitHub-Api-Version': '2022-11-28' }, x || {}); }
  async req(url, opt) {
    let r;
    try { r = await fetch(url, opt); } catch (e) { throw erro('Sem conexão com o GitHub', { offline: true }); }
    return r;
  }
  async falhaHttp(r) {
    let m = ''; try { m = (await r.json()).message || ''; } catch (e) {}
    if (r.status === 401) return erro('Token inválido ou expirado. Gere outro em Ajustes.', { status: 401, auth: true });
    if (r.status === 403) return erro('Sem permissão ou limite da API atingido. ' + m, { status: 403, auth: true });
    if (r.status === 404) return erro('Repositório não encontrado (ou o token não tem acesso a ele).', { status: 404 });
    return erro(`GitHub respondeu ${r.status}. ${m}`, { status: r.status });
  }
  async carregar(etag) {
    const h = etag ? this.hdr({ 'If-None-Match': etag }) : this.hdr();
    const r = await this.req(this.url(true), { headers: h, cache: 'no-store' });
    if (r.status === 304) return { naoMudou: true };
    if (r.status === 404) {
      // distingue "arquivo não existe" de "repositório inacessível"
      const rr = await this.req(`${this.api}/repos/${encodeURIComponent(this.owner)}/${encodeURIComponent(this.repo)}`, { headers: this.hdr(), cache: 'no-store' });
      if (rr.ok) return { naoExiste: true };
      throw await this.falhaHttp(rr);
    }
    if (!r.ok) throw await this.falhaHttp(r);
    const j = await r.json();
    let texto;
    if (j.content && j.encoding === 'base64') texto = b64dec(j.content);
    else { // arquivo > 1 MB: busca o conteúdo bruto
      const r2 = await this.req(this.url(true), { headers: this.hdr({ 'Accept': 'application/vnd.github.raw+json' }), cache: 'no-store' });
      if (!r2.ok) throw await this.falhaHttp(r2);
      texto = await r2.text();
    }
    return { data: JSON.parse(texto), sha: j.sha, etag: r.headers.get('ETag') };
  }
  async salvar(dados, sha, msg) {
    const body = { message: msg, content: b64enc(JSON.stringify(dados, null, 1) + '\n'), branch: this.branch };
    if (sha) body.sha = sha;
    const r = await this.req(this.url(false), { method: 'PUT', headers: this.hdr({ 'Content-Type': 'application/json' }), body: JSON.stringify(body) });
    if (r.status === 409 || r.status === 422) throw erro('Conflito de versão', { conflito: true, status: r.status });
    if (!r.ok) throw await this.falhaHttp(r);
    const j = await r.json();
    return { sha: j.content.sha };
  }
}

class DemoStore { // dados fictícios, só neste aparelho
  constructor() { this.id = 'demo'; this.k = 'fin.demo.servidor'; }
  async carregar() {
    let x = LS.get(this.k);
    if (!x) { x = { v: 1, d: dadosDemo() }; LS.set(this.k, x); }
    return { data: x.d, sha: String(x.v), etag: null };
  }
  async salvar(d, sha) {
    const x = LS.get(this.k) || { v: 0 };
    if (sha && String(x.v) !== String(sha)) throw erro('Conflito de versão', { conflito: true });
    x.v++; x.d = d; LS.set(this.k, x); return { sha: String(x.v) };
  }
}

function dadosDemo() {
  const d = dadosVazios(), c = d.config, hoje = hojeISO();
  c.pessoas = ['Ana', 'Beto'];
  c.rendas = [{ id: 'sal-ana', nome: 'Salário Ana', pessoa: 'Ana', valor: 450000, dia: 5 }, { id: 'sal-beto', nome: 'Salário Beto', pessoa: 'Beto', valor: 250000, dia: 20 }];
  c.fixas = [{ id: 'aluguel', nome: 'Aluguel', valor: 150000, dia: 10, cartao: false }, { id: 'luz', nome: 'Luz', valor: 22000, dia: 15, cartao: false },
             { id: 'internet', nome: 'Internet', valor: 10000, dia: 15, cartao: false }, { id: 'stream', nome: 'Streaming', valor: 4000, dia: 20, cartao: true }];
  c.categorias = [['mercado','🛒','Mercado',120000],['combustivel','⛽','Combustível',40000],['restaurante','🍔','Restaurante/delivery',40000],
                  ['farmacia','💊','Farmácia',15000],['lazer','🎉','Lazer',30000],['imprevistos','❓','Imprevistos',20000]]
                 .map(([id, icone, nome, limite]) => ({ id, icone, nome, limite }));
  c.fundos = [{ id: 'reserva', icone: '🛟', nome: 'Reserva de emergência', meta: 2000000, aporte: 100000, saldoInicial: 300000 },
              { id: 'viagem', icone: '✈️', nome: 'Viagem', meta: 1500000, aporte: 76000, saldoInicial: 0 }];
  const ym = cicloDaData(hoje, 25), { ini } = cicloRange(ym, 25);
  const dia = n => { const x = new Date(+ini.slice(0, 4), +ini.slice(5, 7) - 1, +ini.slice(8, 10) + n); const s = `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`; return s > hoje ? hoje : s; };
  const L = (n, cat, valor, desc, forma, pessoa, parcelas) => d.lancamentos.push({ id: uid() + n, data: dia(n), ciclo: cicloDaData(dia(n), 25), valor, parcelas: parcelas || 1, categoria: cat, descricao: desc, forma, pessoa, criadoEm: new Date().toISOString() });
  L(1, 'mercado', 38750, 'Supermercado', 'cartao', 'Ana'); L(2, 'combustivel', 20000, 'Posto', 'cartao', 'Beto');
  L(3, 'restaurante', 8990, 'Pizza', 'pix', 'Ana'); L(5, 'mercado', 21430, 'Sacolão', 'debito', 'Beto');
  L(6, 'lazer', 36000, 'Show (3x)', 'cartao', 'Ana', 3); L(8, 'farmacia', 4720, 'Farmácia', 'cartao', 'Beto');
  d.movimentos.push({ id: uid(), fundo: 'viagem', valor: 76000, data: dia(1), ciclo: ym, tipo: 'aporte', descricao: 'Aporte do mês', pessoa: 'Ana' });
  return d;
}

/* ---------- sincronização ---------- */
function criarStore() {
  if (LS.get('fin.demo')) return new DemoStore();
  const c = LS.get('fin.conexao');
  return (c && c.token && c.owner && c.repo) ? new GitHubStore(c) : null;
}
const Sync = {
  store: null, remoto: null, sha: null, etag: null, pend: [], vista: null,
  estado: 'ok', msg: '', ocupado: false, denovo: false, antigos: new Set(), naoExiste: false, carregou: false,
  chave(k) { return 'fin.' + (this.store ? this.store.id : 'x') + '.' + k; },
  init() {
    this.store = criarStore(); this.remoto = null; this.sha = null; this.etag = null; this.antigos = new Set();
    this.naoExiste = false; this.carregou = false; this.estado = 'ok'; this.msg = '';
    if (!this.store) { this.pend = []; this.vista = null; return; }
    const c = LS.get(this.chave('cache')); if (c) { this.remoto = c.d; this.sha = c.sha; this.carregou = true; }
    this.pend = LS.get(this.chave('pend'), []); this.recalc();
  },
  recalc() {
    if (!this.remoto) { this.vista = null; return; }
    let d = normalizar(clone(this.remoto));
    for (const op of this.pend) { try { d = aplicarOp(d, op); } catch (e) { console.warn('op ignorada', op, e); } }
    this.vista = d;
  },
  guardar() { LS.set(this.chave('cache'), { d: this.remoto, sha: this.sha }); LS.set(this.chave('pend'), this.pend); },
  setEstado(e, m) { this.estado = e; this.msg = m || ''; renderTopo(); },
  falha(e) {
    console.warn(e);
    if (e.offline) this.setEstado('offline', 'Sem internet — os lançamentos ficam guardados e sobem quando voltar.');
    else this.setEstado('erro', e.message);
  },
  async puxarInterno(forcar) {
    const r = await this.store.carregar(forcar ? null : this.etag);
    if (r.naoMudou) return false;
    if (r.naoExiste) { this.naoExiste = true; this.carregou = true; this.remoto = null; this.sha = null; this.recalc(); return true; }
    this.naoExiste = false; this.carregou = true;
    if (this.antigos.has(r.sha)) return false; // resposta atrasada de uma versão já substituída

    <div class="campo"><label>Descrição</label><input type="text" id="m-desc" placeholder="${tipo === 'aporte' ? 'Aporte do mês' : 'Ex.: pagamento do IPVA'}"></div>
    <div class="campo"><label>Data</label><input type="date" id="m-data" value="${hojeISO()}"></div><button class="btn" id="m-ok">Confirmar</button>
    ${tipo === 'aporte' ? '<p class="dica">O aporte planejado do ciclo também é registrado automaticamente no fechamento. Se guardar agora, o fechamento lança só a diferença.</p>' : ''}`, sh => {
    sh.querySelector('#m-ok').onclick = () => {
      const v = parseValor(sh.querySelector('#m-valor').value); if (!(v > 0)) return toast('Informe o valor.');
      const data = sh.querySelector('#m-data').value || hojeISO();
      fecharSheet();
      Sync.enfileirar({ t: 'mov.add', m: { id: uid(), fundo: fid, valor: tipo === 'aporte' ? v : -v, data, ciclo: S.ciclo, tipo, descricao: sh.querySelector('#m-desc').value.trim() || (tipo === 'aporte' ? 'Aporte' : 'Retirada'), pessoa: eu() } });
    };
  });
}
function abrirFechar() {
  const ym = S.ciclo, pv = previaFechamento(ym), c = cfg(), { fim } = cicloRange(ym), cedo = hojeISO() <= fim;
  const destinoPadrao = (c.fundos.find(f => f.id === 'reserva') || c.fundos[0] || {}).id;
  abrirSheet(`Fechar ${nomeCiclo(ym)}`, `${cedo ? `<div class="alertinha">O ciclo ainda não terminou (vai até ${fmtD(fim)}). Fechar agora congela os números.</div>` : ''}
    <div class="campo"><label>Aportes planejados que serão registrados</label><div class="linhas">${pv.pend.map(x => `<div class="ln"><div class="meio">${esc(x.f.icone || '')} ${esc(x.f.nome)}${x.feito ? `<small>já guardado ${fmt(x.feito)}</small>` : ''}</div><div class="val">${fmt(x.falta)}</div></div>`).join('') || '<div class="vazio">Nenhum.</div>'}</div></div>
    <div class="campo"><label>${pv.sobra >= 0 ? `Sobra do ciclo: ${fmt(pv.sobra)} — enviar para` : `Faltou ${fmt(-pv.sobra)} — tirar de`}</label>
    <select id="f-dest">${c.fundos.map(f => `<option value="${esc(f.id)}" ${f.id === destinoPadrao ? 'selected' : ''}>${esc(f.icone || '')} ${esc(f.nome)}</option>`).join('')}</select></div>
    <button class="btn" id="f-ok">Fechar ciclo</button>`, sh => {
    sh.querySelector('#f-ok').onclick = () => {
      const dest = sh.querySelector('#f-dest').value, hoje = hojeISO();
      const movs = pv.pend.filter(x => x.falta > 0).map(x => ({ id: uid() + x.f.id, fundo: x.f.id, valor: x.falta, data: hoje, ciclo: ym, tipo: 'aporte', descricao: `Aporte de ${nomeCiclo(ym)}`, pessoa: eu(), fechamento: ym }));
      if (pv.sobra && dest) movs.push({ id: uid() + 'sobra', fundo: dest, valor: pv.sobra, data: hoje, ciclo: ym, tipo: 'sobra', descricao: `${pv.sobra > 0 ? 'Sobra' : 'Estouro'} de ${nomeCiclo(ym)}`, pessoa: eu(), fechamento: ym });
      const snap = Object.assign(clone(plano(ym)), { fechado: true, snapshot: true, fechamento: { em: hoje, pessoa: eu(), sobra: pv.sobra, destino: dest } });
      fecharSheet(); Sync.enfileirar({ t: 'ciclo.fechar', ciclo: ym, snap, movs }); toast(`${nomeCiclo(ym)} fechado.`);
    };
  });
}

/* ----- ações ----- */
function baixar(nome, conteudo, tipo) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([conteudo], { type: tipo })); a.download = nome;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function lerEditor(box, key) {
  const orig = cfg()[key], ymA = cicloDaData(hojeISO());
  return [...box.querySelectorAll('.ed-row')].map(row => {
    const o = Object.assign({}, orig.find(x => x.id === row.dataset.id) || { id: row.dataset.id });
    EDS[key].f.forEach(([k, , tp]) => {
      const inp = row.querySelector(`[data-f="${k}"]`); if (!inp) return;
      if (tp === 'bool') o[k] = inp.checked;
      else if (tp === 'val') { const v = parseValor(inp.value); o[k] = isNaN(v) ? 0 : v; }
      else if (tp === 'int') o[k] = inp.value === '' ? null : parseInt(inp.value, 10);
      else if (tp === 'cartao') o[k] = inp.value;
      else o[k] = inp.value.trim();
    });
    if (key === 'fixas') {
      if (o.parcelaTotal > 0) { o.parcelaNum = o.parcAtual || 1; o.parcelaRef = ymA; } else { delete o.parcelaTotal; delete o.parcelaNum; delete o.parcelaRef; }
      delete o.parcAtual; o.dia = o.dia || 1;
    }
    if (key === 'rendas') o.dia = o.dia || 1;
    Object.keys(o).forEach(k => o[k] == null && delete o[k]);
    return o;
  }).filter(o => o.nome);
}
const ACT = {
  ir: el => navegar(el.dataset.v === 'ajustes-forcado' ? 'ajustes' : el.dataset.v, null, !!el.closest('#abas')),
  voltar: () => { if (history.state && history.state.fin) history.back(); else voltarTela(); },
  ciclo: el => { S.ciclo = ymAdd(S.ciclo, +el.dataset.d); render(); },
  'ciclo-hoje': () => { S.ciclo = cicloDaData(hojeISO()); render(); },
  lancar: () => abrirLancamento(),
  editar: el => { const l = D().lancamentos.find(x => x.id === el.dataset.id); if (l) abrirLancamento(l); },
  filtrar: el => { if (S.view === 'extrato') { S.filtroCat = el.dataset.id || null; render(); } else navegar('extrato', el.dataset.id || null, false); },
  pagar: el => { const id = el.dataset.id, p = plano(S.ciclo); Sync.enfileirar({ t: 'plano.set', ciclo: S.ciclo, path: ['pagos', id], v: p.pagos[id] ? null : true }); },
  remanejar: () => abrirRemanejar(),
  ajustes: () => navegar('ajustes', null, true),
  parceladas: () => abrirParceladas(),
  'contas-todas': () => { S.contasTodas = !S.contasTodas; render(); },
  'filtro-pessoa': el => { S.filtroPessoa = el.dataset.v || null; render(); },
  step: el => {
    const path = el.dataset.path.split('.'), p = plano(S.ciclo), atual = (p[path[0]] || {})[path[1]] || 0;
    Sync.enfileirar({ t: 'plano.set', ciclo: S.ciclo, path, v: Math.max(0, Math.round((atual + +el.dataset.d) / 1000) * 1000) });
  },
  'rec-opc': () => { S.recSemOpc = !S.recSemOpc; render(); },
  'rec-aplicar': () => {
    const ym = S.ciclo, itens = recomendacao(ym, resumo(ym), S.recSemOpc), ops = [];
    itens.forEach(x => {
      if (x.tipo === 'limite') ops.push({ t: 'plano.set', ciclo: ym, path: ['limites', x.id], v: x.para });
      if (x.tipo === 'fixa') ops.push({ t: 'plano.set', ciclo: ym, path: ['fixas', x.id], v: 0 });
      if (x.tipo === 'aporte') ops.push({ t: 'plano.set', ciclo: ym, path: ['aportes', x.id], v: x.para });
    });
    if (!ops.length) return;
    Sync.enfileirar(ops);
    const canc = itens.filter(x => x.tipo === 'fixa').map(x => (cfg().fixas.find(f => f.id === x.id) || {}).nome);
    toast(`Recomendação aplicada.${canc.length ? ` Lembrem de cancelar: ${canc.join(', ')}. Depois de cancelar, removam em Ajustes → Contas fixas.` : ''}`, 6000);
  },
  'consultor-tudo': () => { S.consultorTudo = !S.consultorTudo; render(); },
  'del-reman': el => Sync.enfileirar({ t: 'plano.pull', ciclo: S.ciclo, campo: 'remanejamentos', id: el.dataset.id }),
  'add-extra': () => abrirExtra(),
  'del-extra': el => Sync.enfileirar({ t: 'plano.pull', ciclo: S.ciclo, campo: 'extras', id: el.dataset.id }),
  'salvar-padrao': () => {
    if (!confirm('Os próximos ciclos passam a começar com os valores deste. Confirmar?')) return;
    const p = plano(S.ciclo), c = clone(cfg());
    c.categorias.forEach(k => { if (p.limites[k.id] != null) k.limite = p.limites[k.id]; });
    c.fundos.forEach(f => { if (p.aportes[f.id] != null) f.aporte = p.aportes[f.id]; });
    c.fixas.forEach(f => { if (p.fixas[f.id] != null) f.valor = p.fixas[f.id]; });
    c.rendas.forEach(r => { if (p.rendas[r.id] != null) r.valor = p.rendas[r.id]; });
    Sync.enfileirar(['categorias', 'fundos', 'fixas', 'rendas'].map(k => ({ t: 'config.set', path: [k], v: c[k] }))); toast('Valores padrão atualizados.');
  },
  'restaurar-padrao': () => { if (confirm('Voltar rendas, fixas, limites e metas deste ciclo aos valores padrão?')) Sync.enfileirar({ t: 'plano.reset', ciclo: S.ciclo }); },
  mov: el => abrirMov(el.dataset.id, el.dataset.tipo),
  'del-mov': el => { if (confirm('Excluir esta movimentação?')) Sync.enfileirar({ t: 'mov.del', id: el.dataset.id }); },
  fechar: () => abrirFechar(),
  reabrir: () => { if (confirm('Reabrir o ciclo? Os aportes e a sobra registrados no fechamento serão desfeitos.')) Sync.enfileirar({ t: 'ciclo.reabrir', ciclo: S.ciclo }); },
  sou: el => { LS.set('fin.eu', el.dataset.v); render(); },
  'forcar-sync': () => { if (Sync.estado === 'erro' && Sync.msg) toast(Sync.msg, 5000); Sync.pend.length ? Sync.sincronizar() : Sync.puxar(true); },
  demo: () => { window.scrollTo(0, 0); LS.set('fin.demo', true); Sync.init(); if (!eu()) LS.set('fin.eu', 'Ana'); S.view = 'inicio'; S.ciclo = null; render(); Sync.puxar(true); },
  'sair-demo': () => { LS.del('fin.demo'); if (['Ana', 'Beto'].includes(eu())) LS.del('fin.eu'); Sync.init(); S.view = 'inicio'; S.ciclo = null; render(); Sync.puxar(true); },
  'reset-demo': () => { Object.keys(localStorage).filter(k => k.startsWith('fin.demo.')).forEach(k => localStorage.removeItem(k)); Sync.init(); S.ciclo = null; render(); Sync.puxar(true); },
  conectar: () => {
    const v = id => ($('#' + id) ? $('#' + id).value.trim() : '');
    const ant = LS.get('fin.conexao', {}) || {};
    const c = { owner: v('cx-owner'), repo: v('cx-repo'), token: v('cx-token'), branch: v('cx-branch') || 'main', path: v('cx-path') || 'financas.json', api: ant.api };
    if (!c.owner || !c.repo || !c.token) return toast('Preencha usuário, repositório e token.');
    LS.set('fin.conexao', c); LS.del('fin.demo'); Sync.init(); S.view = 'inicio'; S.ciclo = null; render(); Sync.puxar(true);
  },
  desconectar: () => { if (!confirm('Remover a conexão deste aparelho?')) return; const c = LS.get('fin.conexao', {}) || {}; delete c.token; LS.set('fin.conexao', c); Sync.init(); S.view = 'inicio'; render(); },
  'criar-arquivo': () => Sync.criarArquivo(),
  'ed-add': el => { const box = el.closest('[data-ed]'), key = box.dataset.ed; box.querySelector('.ed-lista').insertAdjacentHTML('beforeend', edLinha(key, EDS[key].novo())); },
  'ed-del': el => { const row = el.closest('.ed-row'); if (confirm('Remover este item?')) row.remove(); },
  'ed-salvar': el => { const box = el.closest('[data-ed]'), key = box.dataset.ed; Sync.enfileirar({ t: 'config.set', path: [key], v: lerEditor(box, key) }); toast('Salvo.'); },
  'geral-salvar': () => {
    const pessoas = $('#g-pessoas').value.split(',').map(s => s.trim()).filter(Boolean);
    const f = parseInt($('#g-fech').value, 10), vc = parseInt($('#g-venc').value, 10);
    if (!pessoas.length || !(f >= 1 && f <= 31) || !(vc >= 1 && vc <= 31)) return toast('Verifique os campos.');
    Sync.enfileirar([{ t: 'config.set', path: ['pessoas'], v: pessoas }, { t: 'config.set', path: ['cartao'], v: { fechamento: f, vencimento: vc } }]); toast('Salvo.');
  },
  csv: () => {
    const linhas = [['Data', 'Ciclo', 'Descrição', 'Categoria', 'Forma', 'Pessoa', 'Valor total', 'Parcelas']].concat(
      D().lancamentos.slice().sort((a, b) => a.data.localeCompare(b.data)).map(l => [l.data.split('-').reverse().join('/'), nomeCiclo(l.ciclo || cicloDaData(l.data)), l.descricao || '', nomeCat(l.categoria), nomeForma(l.forma), l.pessoa || '', inputValor(l.valor), l.parcelas || 1]));
    baixar('lancamentos.csv', '﻿' + linhas.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
  },
  backup: () => baixar(`financas-${hojeISO()}.json`, JSON.stringify(D(), null, 1), 'application/json')
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled || $('#sheet').contains(el) && !el.dataset.act) return;
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'busca') return;
  const q = semAcento(e.target.value.trim());
  document.querySelectorAll('.lanc[data-busca]').forEach(b => { b.style.display = !q || b.dataset.busca.includes(q) ? '' : 'none'; });
  document.querySelectorAll('.dia').forEach(d => { d.style.display = [...d.querySelectorAll('.lanc')].some(b => b.style.display !== 'none') ? '' : 'none'; });
});
document.addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.acc) S.abertos[d.dataset.acc] = d.open; }, true);
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.chg === 'plano') {
    const v = parseValor(el.value);
    if (isNaN(v) || v < 0) { toast('Valor inválido.'); render(); return; }
    el.value = inputValor(v);
    Sync.enfileirar({ t: 'plano.set', ciclo: S.ciclo, path: el.dataset.path.split('.'), v });
  }
});

/* ----- início ----- */
Sync.init();
render();
if (Sync.store) Sync.puxar(true);
setInterval(() => { if (document.visibilityState === 'visible' && Sync.store) Sync.puxar(); }, 20000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Sync.store) Sync.puxar(); });
window.addEventListener('online', () => Sync.store && Sync.sincronizar());
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
