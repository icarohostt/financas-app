<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Finanças da Casa</title>
<style>
:root{
  --bg:#f4f6f5; --card:#fff; --tx:#1c2321; --tx2:#5d6b67; --linha:#e3e8e6;
  --pri:#0f766e; --pri2:#e6f3f1; --ok:#16a34a; --alerta:#d97706; --neg:#dc2626; --negbg:#fdecec; --alertabg:#fff6e6;
  --raio:14px; --sombra:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1413; --card:#182120; --tx:#e7eeec; --tx2:#9aaba6; --linha:#26312f; --pri:#2dd4bf; --pri2:#123532;
        --negbg:#3a1717; --alertabg:#3a2a10; --sombra:none}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
#topo{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 6px;max-width:720px;margin:0 auto}
.topo1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.topo1 h1{font-size:18px;margin:0}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);background:none;border:0;padding:4px 6px;border-radius:8px;cursor:pointer}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.dot.sync,.dot.pend{background:var(--alerta)} .dot.erro,.dot.offline{background:var(--neg)} .dot.vazio{background:var(--tx2)}
.ciclo{display:flex;align-items:center;justify-content:space-between;margin-top:8px;background:var(--card);border-radius:12px;box-shadow:var(--sombra);padding:4px}
.ciclo button{border:0;background:none;font-size:22px;width:44px;height:38px;border-radius:10px;cursor:pointer;color:var(--pri)}
.ciclo .nome{text-align:center;line-height:1.15}
.ciclo .nome b{display:block;font-size:15px} .ciclo .nome small{color:var(--tx2);font-size:12px}
main{max-width:720px;margin:0 auto;padding:8px 16px 16px}
.card{background:var(--card);border-radius:var(--raio);box-shadow:var(--sombra);padding:14px 16px;margin:0 0 12px}
.card h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3 small{font-weight:400;color:var(--tx2);font-size:12px}
.destaque .rot{color:var(--tx2);font-size:13px}
.grande{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:2px 0}
.sub,.mini{color:var(--tx2);font-size:12.5px}
.neg{color:var(--neg)!important}
.barra{height:8px;border-radius:5px;background:var(--linha);overflow:hidden;margin:6px 0 2px}
.barra i{display:block;height:100%;background:var(--ok);border-radius:5px}
.barra i.alerta{background:var(--alerta)} .barra i.estouro{background:var(--neg)}
.cat{padding:9px 0;border-top:1px solid var(--linha);cursor:pointer}
.cat:first-of-type{border-top:0}
.cat-top{display:flex;justify-content:space-between;gap:8px;font-size:14.5px}
.cat-top span:last-child{font-size:13px;color:var(--tx2);white-space:nowrap}
.aviso{background:var(--alertabg);color:var(--alerta);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13.5px;cursor:pointer;font-weight:600}
.aviso.neg{background:var(--negbg)}
.aviso.ok{background:var(--pri2);color:var(--pri)}
.fat{padding:8px 0;border-top:1px solid var(--linha)}
.fat:first-of-type{border-top:0}
.fat-total{border-top:2px solid var(--linha);padding-top:9px;margin-top:2px}
.parc{border-top:1px solid var(--linha);padding:4px 0}
.parc summary{display:flex;justify-content:space-between;gap:8px;padding:8px 0;list-style:none}
.parc summary::-webkit-details-marker{display:none}
.parc summary span:first-child::before{content:'▸ ';color:var(--tx2)}
.parc[open] summary span:first-child::before{content:'▾ '}
.parc summary small{font-weight:400;color:var(--tx2)}
.voltar{border:0;background:none;color:var(--pri);font-weight:600;font-size:14.5px;padding:4px 2px 10px;cursor:pointer}
.consultor .rec{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px;margin-top:7px;font-size:13.5px;line-height:1.35}
.consultor .rec p{margin:0} .consultor .rec span{font-size:16px;line-height:1.2}
.consultor .rec.alto{background:var(--negbg);color:var(--neg);font-weight:600}
.consultor .rec.medio{background:var(--alertabg);color:var(--alerta);font-weight:600}
.consultor .rec.info{background:var(--bg)}
.consultor .rec.ok{background:var(--pri2);color:var(--pri);font-weight:600}
.consultor .rec[data-act]{cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;padding:11px 16px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer;width:100%;margin-top:10px}
@media (prefers-color-scheme:dark){.btn{color:#04201d}}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.perigo{background:var(--negbg);color:var(--neg)}
.btn.peq{width:auto;padding:7px 12px;margin-top:0;font-size:13px}
.linhas .ln{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--linha)}
.linhas .ln:first-child{border-top:0}
.ln .meio{flex:1;min-width:0}
.ln .meio b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .meio small{color:var(--tx2);font-size:12px}
.ln .val{font-weight:600;white-space:nowrap}
.ln .ic{width:34px;height:34px;border-radius:10px;background:var(--pri2);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.ln.click{cursor:pointer}
.pago .meio b,.pago .val{color:var(--tx2);text-decoration:line-through}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--linha);background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;font-size:15px;color:#fff}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--linha);background:var(--card);border-radius:20px;padding:6px 11px;font-size:13.5px;cursor:pointer;line-height:1.2;text-align:left}
.chip small{display:block;font-size:11px;color:var(--tx2)}
.chip.on{border-color:var(--pri);background:var(--pri2);color:var(--pri);font-weight:600}
.chip.on small{color:var(--pri)}
.rolar{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.rolar .chip{white-space:nowrap;flex:none}
.campo{margin:12px 0 0}
.campo>label{display:block;font-size:12.5px;color:var(--tx2);margin-bottom:5px;font-weight:600}
input:not([type]),input[type=text],input[type=date],input[type=number],input[type=password],input.money,select{width:100%;padding:10px 12px;border:1.5px solid var(--linha);border-radius:10px;background:var(--card)}
input:focus,select:focus{outline:none;border-color:var(--pri)}
input:disabled{opacity:.6}
input.grande-in{font-size:28px;font-weight:700;padding:10px 12px}
.pl{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--linha)}
.pl:first-child{border-top:0}
.pl .nm{flex:1;min-width:0;font-size:14px}
.pl .nm small{display:block;color:var(--tx2);font-size:11.5px}
.pl input.money{width:122px;text-align:right;padding:8px 10px}
.x{border:0;background:none;color:var(--tx2);font-size:18px;cursor:pointer;padding:4px 6px}
.resumo{position:sticky;top:calc(98px + env(safe-area-inset-top));z-index:4}
.eq{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13.5px}
.eq .t{font-weight:700;border-top:1px solid var(--linha);padding-top:5px;margin-top:3px}
#abas{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--linha);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#abas button{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--tx2);gap:1px;padding:4px 8px;cursor:pointer;min-width:58px}
#abas button span{font-size:20px;filter:grayscale(1);opacity:.7}
#abas button.on{color:var(--pri);font-weight:700}
#abas button.on span{filter:none;opacity:1}
#fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:7;width:58px;height:58px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(15,118,110,.4);cursor:pointer}
@media (prefers-color-scheme:dark){#fab{color:#04201d}}
#fab[hidden]{display:none}
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sheet-h h2{font-size:17px;margin:0}
.alertinha{margin-top:10px;padding:9px 12px;border-radius:10px;font-size:13px;background:var(--alertabg);color:var(--alerta);font-weight:600}
.alertinha.neg{background:var(--negbg);color:var(--neg)}
.alertinha:empty{display:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));z-index:30;background:#1c2321;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast[hidden]{display:none}
.vazio{color:var(--tx2);text-align:center;padding:18px 0;font-size:14px}
.ed-row{border:1px solid var(--linha);border-radius:12px;padding:8px 10px;margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;position:relative}
.ed-row label{font-size:11px;color:var(--tx2);display:flex;flex-direction:column;gap:3px;flex:1 1 140px}
.ed-row label.w3{flex:0 0 70px}
.ed-row label.bool{flex:0 0 auto;flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--tx);padding-bottom:10px}
.ed-row input{padding:8px 9px}
.ed-row .x{position:absolute;top:2px;right:2px}
.prog{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--tx2)}
.prog span:last-child{text-align:right}
.boas{text-align:center;padding:24px 8px 8px}
.boas h2{margin:6px 0}
details summary{cursor:pointer;font-weight:600;font-size:14px;padding:4px 0}
.dica{font-size:12.5px;color:var(--tx2);margin-top:8px}
code{background:var(--pri2);padding:1px 5px;border-radius:5px;font-size:12.5px}
</style>
</head>
<body>
<header id="topo"></header>
<main id="main"></main>
<nav id="abas"></nav>
<button id="fab" data-act="lancar" aria-label="Novo lançamento" hidden>+</button>
<div id="sheet" class="sheet-wrap" hidden></div>
<div id="toast" hidden></div>

<script>
'use strict';
/* =====================================================================
   Finanças da Casa — orçamento base zero por categoria, ciclo da fatura.
   Dados: um arquivo JSON (financas.json) num repositório privado do
   GitHub, lido e gravado pela API com um token de acesso.
   Valores monetários em CENTAVOS (inteiros).
   ===================================================================== */

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const soma = arr => arr.reduce((a, b) => a + (b || 0), 0);
const somaObj = o => soma(Object.values(o || {}));
const fmt = c => ((c || 0) / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const inputValor = c => ((c || 0) / 100).toFixed(2).replace('.', ',');
function parseValor(s) {
  s = String(s == null ? '' : s).replace(/[R$\s]/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return isFinite(n) ? Math.round(n * 100) : NaN;
}
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES3 = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const pad = n => String(n).padStart(2, '0');
function hojeISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function ymAdd(ym, n) { let [y, m] = ym.split('-').map(Number); m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return `${y}-${pad(m)}`; }
function ymDiff(a, b) { const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number); return (ya - yb) * 12 + (ma - mb); }
function diasNoMes(ym) { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function diaNoMes(ym, dia) { return `${ym}-${pad(Math.min(dia, diasNoMes(ym)))}`; }
function diffDias(a, b) { const p = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)); return Math.round((p(b) - p(a)) / 864e5); }
const fmtD = iso => `${iso.slice(8, 10)}/${iso.slice(5, 7)}`;
function nomeCiclo(ym) { const [y, m] = ym.split('-').map(Number); return `${MESES[m - 1]}/${y}`; }
function curtoCiclo(ym) { const [y, m] = ym.split('-').map(Number); return `${MES3[m - 1]}/${String(y).slice(2)}`; }

/* ---------- ciclo da fatura ----------
   O ciclo "AAAA-MM" vai do dia seguinte ao fechamento do mês anterior até o
   dia do fechamento no mês MM. Ex.: fechamento 25 → Dezembro/2026 = 26/11 a 25/12. */
function fech() { return (cfg() && cfg().cartao && cfg().cartao.fechamento) || 25; }
function cicloDaData(iso, f) {
  f = f || fech(); const ym = iso.slice(0, 7), d = +iso.slice(8, 10);
  return d <= Math.min(f, diasNoMes(ym)) ? ym : ymAdd(ym, 1);
}
function cicloRange(ym, f) {
  f = f || fech(); const ant = ymAdd(ym, -1); const fimAnt = Math.min(f, diasNoMes(ant));
  const ini = fimAnt >= diasNoMes(ant) ? `${ym}-01` : `${ant}-${pad(fimAnt + 1)}`;
  return { ini, fim: diaNoMes(ym, f) };
}
/* Rendas e contas fixas seguem o mês do calendário que dá nome ao ciclo:
   em Dezembro/2026 entram o salário de 15/12 e 31/12 e as contas de 10, 15 e 30/12.
   Só os gastos variáveis (cartão) seguem a janela da fatura (24/11 a 23/12). */
function dataNoCiclo(ym, dia) { return diaNoMes(ym, dia); }
function vencimentoFatura(ym) {
  const c = cfg().cartao, v = c.vencimento || 1;
  return v > c.fechamento ? diaNoMes(ym, v) : diaNoMes(ymAdd(ym, 1), v);
}

/* ---------- modelo de dados ---------- */
function dadosVazios() {
  return {
    versao: 1,
    config: {
      pessoas: ['Pessoa 1', 'Pessoa 2'],
      cartao: { fechamento: 25, vencimento: 1 },
      formas: [{ id: 'cartao', nome: 'Cartão de crédito', cartao: true }, { id: 'pix', nome: 'Pix', cartao: false },
               { id: 'debito', nome: 'Débito', cartao: false }, { id: 'dinheiro', nome: 'Dinheiro', cartao: false }],
      rendas: [], fixas: [],
      categorias: [['mercado','🛒','Mercado'],['combustivel','⛽','Combustível'],['restaurante','🍔','Restaurante/delivery'],
                   ['farmacia','💊','Farmácia'],['lazer','🎉','Lazer'],['imprevistos','❓','Imprevistos']]
                  .map(([id, icone, nome]) => ({ id, icone, nome, limite: 0 })),
      fundos: [{ id: 'reserva', icone: '🛟', nome: 'Reserva de emergência', meta: 0, aporte: 0, saldoInicial: 0 }]
    },
    orcamentos: {}, lancamentos: [], movimentos: []
  };
}
function normalizar(d) {
  d.orcamentos = d.orcamentos || {}; d.lancamentos = d.lancamentos || []; d.movimentos = d.movimentos || [];
  const c = d.config = d.config || {};
  c.pessoas = c.pessoas || []; c.cartao = c.cartao || { fechamento: 25, vencimento: 1 };
  c.formas = c.formas || []; c.rendas = c.rendas || []; c.fixas = c.fixas || [];
  c.categorias = c.categorias || []; c.fundos = c.fundos || [];
  return d;
}
function setPath(obj, path, v) {
  let o = obj;
  for (let i = 0; i < path.length - 1; i++) { if (o[path[i]] == null || typeof o[path[i]] !== 'object') o[path[i]] = {}; o = o[path[i]]; }
  const k = path[path.length - 1];
  if (v === undefined || v === null) delete o[k]; else o[k] = v;
}
/* Operações: cada alteração é uma operação reaplicável. Se duas pessoas
   gravarem ao mesmo tempo, o app baixa a versão nova e reaplica as suas. */
function aplicarOp(d, op) {
  normalizar(d);
  const P = () => (d.orcamentos[op.ciclo] = d.orcamentos[op.ciclo] || {});
  switch (op.t) {
    case 'lanc.add': if (!d.lancamentos.some(x => x.id === op.l.id)) d.lancamentos.push(op.l); break;
    case 'lanc.upd': { const i = d.lancamentos.findIndex(x => x.id === op.l.id); if (i >= 0) d.lancamentos[i] = op.l; break; }
    case 'lanc.del': d.lancamentos = d.lancamentos.filter(x => x.id !== op.id); break;
    case 'plano.set': setPath(P(), op.path, op.v); break;
    case 'plano.push': { const p = P(); p[op.campo] = p[op.campo] || []; if (!p[op.campo].some(x => x.id === op.v.id)) p[op.campo].push(op.v); break; }
    case 'plano.pull': { const p = d.orcamentos[op.ciclo]; if (p && p[op.campo]) p[op.campo] = p[op.campo].filter(x => x.id !== op.id); break; }
    case 'plano.reset': { const p = d.orcamentos[op.ciclo]; if (p) ['rendas', 'fixas', 'limites', 'aportes'].forEach(k => delete p[k]); break; }
    case 'mov.add': if (!d.movimentos.some(x => x.id === op.m.id)) d.movimentos.push(op.m); break;
    case 'mov.del': d.movimentos = d.movimentos.filter(x => x.id !== op.id); break;
    case 'ciclo.fechar':
      if (d.orcamentos[op.ciclo] && d.orcamentos[op.ciclo].fechado) break; // outra pessoa já fechou
      d.orcamentos[op.ciclo] = op.snap; op.movs.forEach(m => d.movimentos.push(m)); break;
    case 'ciclo.reabrir': {
      const p = d.orcamentos[op.ciclo];
      if (p) { p.fechado = false; delete p.snapshot; delete p.fechamento; }
      d.movimentos = d.movimentos.filter(m => m.fechamento !== op.ciclo); break;
    }
    case 'config.set': setPath(d.config, op.path, op.v); break;
  }
  return d;
}

/* ---------- armazenamento ---------- */
function erro(msg, extra) { return Object.assign(new Error(msg), extra || {}); }
function b64enc(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64dec(b64) { const bin = atob(String(b64).replace(/\s/g, '')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }

class GitHubStore {
  constructor(c) {
    this.owner = c.owner; this.repo = c.repo; this.branch = c.branch || 'main'; this.path = c.path || 'financas.json';
    this.token = c.token; this.api = (c.api || 'https://api.github.com').replace(/\/$/, '');
    this.id = `${this.owner}/${this.repo}/${this.path}`;
  }

    case 'lanc.upd': m = `edita lançamento ${op.l.descricao || nomeCat(op.l.categoria)}`; break;
    case 'lanc.del': m = 'exclui lançamento'; break;
    case 'mov.add': m = `caixinha ${op.m.valor > 0 ? '+' : ''}${fmt(op.m.valor)}`; break;

  c.rendas.forEach(r => p.rendas[r.id] = r.valor || 0);
  c.fixas.forEach(f => {
    if (f.auto === 'parcelamentos') { const v = soma(parcelasAnteriores(ym).map(x => x.valor)); if (v) p.fixas[f.id] = v; }
    else if (fixaAtiva(f, ym)) p.fixas[f.id] = f.valor || 0;

/* ----- consultor: recomendações calculadas a partir do plano, do ritmo e do histórico ----- */
const NIVEL = { alto: 0, medio: 1, info: 2, ok: 3 };
function listaNomes(a) { return a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1]; }
function mediaHistorica(ym, n) { // média por categoria dos últimos ciclos que tiveram lançamentos
  const ciclos = [];
  for (let i = 1; i <= 12 && ciclos.length < n; i++) { const c = ymAdd(ym, -i); if (itensDoCiclo(c).length) ciclos.push(c); }
  if (!ciclos.length) return null;
  const m = {};
  ciclos.forEach(c => itensDoCiclo(c).forEach(it => m[it.l.categoria] = (m[it.l.categoria] || 0) + it.valor / ciclos.length));

function consultor(ym, r) {
  const c = cfg(), out = [], add = (nivel, icone, texto, act, cta) => out.push({ nivel, icone, texto, act, cta });
  const nomes = listaNomes(c.pessoas), hoje = hojeISO(), { ini, fim } = cicloRange(ym);
  const atual = hoje >= ini && hoje <= fim, passado = hoje > fim;
  const diasTot = diffDias(ini, fim) + 1, diasPass = atual ? diffDias(ini, hoje) + 1 : (passado ? diasTot : 0);
  const fr = diasPass / diasTot, diasRest = diasTot - diasPass + (atual ? 1 : 0);

  if (!r.p.fechado && r.falta < 0) add('alto', '🧮', `O planejado passou da renda em ${fmt(-r.falta)}. Enquanto isso não for coberto (com renda extra, como o 13º, ou reduzindo limites em Planejar), considerem que só dá para gastar ${fmt(r.disponivel)} nas categorias.`, 'planejar', true);

    return out;

    if (!out.length) add('ok', '✅', `Planejamento do ciclo completo.`);

  }

  // 1. categorias estouradas
  const sobrando = cats.filter(k => k.resta > 0).sort((a, b) => b.resta - a.resta)[0];
  cats.filter(k => k.resta < 0).forEach(k => add('alto', '🚫', `${nomes}, vocês não podem gastar mais em ${nm(k)}: já passou ${fmt(-k.resta)} do limite.${sobrando ? ` Se for inevitável, remanejem de ${sobrando.nome} (sobram ${fmt(sobrando.resta)}).` : ''}`, 'remanejar'));

  // 6. vale-alimentação

    .map(x => Object.assign(x, { data: dataNoCiclo(ym, x.f.dia || 1) })).filter(x => x.data >= hoje && diffDias(hoje, x.data) <= 3 && !x.f.cartao);

  // 8. parcelamentos novos

  if (novasParc.length) add('medio', '💳', `${novasParc.length === 1 ? 'Uma compra parcelada' : novasParc.length + ' compras parceladas'} neste ciclo. Os próximos ciclos já começam com ${fmt(futuro)} comprometidos. Evitem parcelar até as parcelas atuais acabarem.`);
  // 9. Encantar

    add('ok', '✅', `${nomes}, vocês estão dentro do planejado. Dá para gastar até ${fmt(porDia)} por dia nas categorias até ${fmtD(fim)}.`);
  }

function inMoney(path, v, dis) { return `<input class="money" inputmode="decimal" value="${inputValor(v)}" data-chg="plano" data-path="${esc(path)}" ${dis ? 'disabled' : ''}>`; }
/* ----- recomendação do consultor para fechar o planejamento em zero ----- */
const DEZ = 1000; // R$ 10,00 em centavos
function recomendacao(ym, r, semOpcionais) {
  const c = cfg(), p = r.p, itens = [];
  const reserva = c.fundos.find(f => f.id === 'reserva') || c.fundos[0];
  if (r.falta > 0) {
    if (reserva) itens.push({ tipo: 'aporte', id: reserva.id, para: (p.aportes[reserva.id] || 0) + r.falta, valor: r.falta,
      texto: `Mandar os ${fmt(r.falta)} sem destino para ${reserva.icone || ''} ${reserva.nome}. Dinheiro sem destino costuma virar gasto.` });
    return itens;
  }
  let falta = -r.falta;
  if (!semOpcionais) c.fixas.filter(f => f.opcional && (p.fixas[f.id] || 0) > 0).sort((a, b) => p.fixas[b.id] - p.fixas[a.id]).forEach(f => {
    if (falta <= 0) return;
    itens.push({ tipo: 'fixa', id: f.id, para: 0, valor: p.fixas[f.id], opcional: true, texto: `Cancelar ${f.nome}: economiza ${fmt(p.fixas[f.id])} sem mudar nenhum hábito.` });
    falta -= p.fixas[f.id];
  });
  const cand = r.cats.filter(k => { const cat = catPorId(k.id); return cat && !cat.essencial && k.limite > 0; }).sort((a, b) => b.limite - a.limite);
  const cortes = {};
  for (const teto of [0.16, 0.3]) for (const k of cand) { // primeiro cortes leves; se não bastar, um pouco mais
    if (falta <= 0) break;
    const max = Math.floor(k.limite * teto / DEZ) * DEZ - (cortes[k.id] || 0); if (max <= 0) continue;
    const corte = Math.min(Math.ceil(falta / DEZ) * DEZ, max);
    cortes[k.id] = (cortes[k.id] || 0) + corte; falta -= corte;
  }
  cand.filter(k => cortes[k.id]).forEach(k => itens.push({ tipo: 'limite', id: k.id, para: k.limite - cortes[k.id], valor: cortes[k.id],
    texto: `${k.icone} ${k.nome}: de ${fmt(k.limite)} para ${fmt(k.limite - cortes[k.id])} (−${fmt(cortes[k.id])}).` }));
  if (falta < 0 && reserva) itens.push({ tipo: 'aporte', id: reserva.id, para: (p.aportes[reserva.id] || 0) - falta, valor: -falta, texto: `Os ${fmt(-falta)} que sobram do arredondamento vão para ${reserva.nome}.` });
  if (falta > 0) itens.push({ tipo: 'aviso', valor: falta, texto: `Ainda faltariam ${fmt(falta)}. Para isso, só com renda extra (como o 13º) ou reduzindo as metas.` });
  return itens;
}

function baixar(nome, conteudo, tipo) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([conteudo], { type: tipo })); a.download = nome;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function lerEditor(box, key) {
  const orig = cfg()[key], ymA = cicloDaData(hojeISO());
  return [...box.querySelectorAll('.ed-row')].map(row => {
    const o = Object.assign({}, orig.find(x => x.id === row.dataset.id) || { id: row.dataset.id });
    EDS[key].f.forEach(([k, , tp]) => {
      const inp = row.querySelector(`[data-f="${k}"]`); if (!inp) return;
      if (tp === 'bool') o[k] = inp.checked;
      else if (tp === 'val') { const v = parseValor(inp.value); o[k] = isNaN(v) ? 0 : v; }
      else if (tp === 'int') o[k] = inp.value === '' ? null : parseInt(inp.value, 10);
      else if (tp === 'cartao') o[k] = inp.value;
      else o[k] = inp.value.trim();
    });
    if (key === 'fixas') {
      if (o.parcelaTotal > 0) { o.parcelaNum = o.parcAtual || 1; o.parcelaRef = ymA; } else { delete o.parcelaTotal; delete o.parcelaNum; delete o.parcelaRef; }
      delete o.parcAtual; o.dia = o.dia || 1;
    }
    if (key === 'rendas') o.dia = o.dia || 1;
    Object.keys(o).forEach(k => o[k] == null && delete o[k]);
    return o;
  }).filter(o => o.nome);
}

  if (el.dataset && el.dataset.chg === 'plano') {
    const v = parseValor(el.value);
    if (isNaN(v) || v < 0) { toast('Valor inválido.'); render(); return; }
    el.value = inputValor(v);
    Sync.enfileirar({ t: 'plano.set', ciclo: S.ciclo, path: el.dataset.path.split('.'), v });
  }
});

/* ----- início ----- */
Sync.init();
render();
if (Sync.store) Sync.puxar(true);
setInterval(() => { if (document.visibilityState === 'visible' && Sync.store) Sync.puxar(); }, 20000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Sync.store) Sync.puxar(); });
window.addEventListener('online', () => Sync.store && Sync.sincronizar());
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
